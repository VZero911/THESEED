[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Required by openzeppelin-foundry-upgrades (runs `npx @openzeppelin/upgrades-core` for layout validation).
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "out" }, { access = "read-write", path = "deployments" }]

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
local = "${RPC_URL}"

[lint]
# Excluded on purpose (reviewed in phase 1):
# - reentrancy-events: flags every event after `onlyRole` / token calls; all such functions are role-gated and
#   MintManager updates its state before calling the tokens.
# - block-timestamp / weak-prng: MintManager epochs are time windows by design (a few seconds of validator skew is
#   irrelevant at a 1-day epoch); no randomness is derived from block data.
exclude_lints = ["reentrancy-events", "block-timestamp", "weak-prng"]
